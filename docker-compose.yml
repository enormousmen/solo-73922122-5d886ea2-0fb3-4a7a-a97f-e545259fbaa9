services:
  dns-planner:
    build:
      context: .
    image: dns-release-planner:1.1.0
    container_name: dns-release-planner
    ports:
      - "8000:8000"
    environment:
      # 首次启动从镜像内样例载入暂存库；之后重启沿用卷里的快照。
      STAGING_SEED_PATH: /app/seed/staging-seed.json
      STAGING_SNAPSHOT_PATH: /data/staging-snapshot.json
    volumes:
      - staging-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  staging-data:
